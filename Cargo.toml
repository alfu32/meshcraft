[workspace]
members = ["apps/desktop", "crates/meshcraft-core", "crates/meshcraft-io", "experiments/stack"]
default-members = ["apps/desktop"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97.1"
version = "0.1.0"

[workspace.dependencies]
base64 = "=0.23.1"
eframe = { version = "=0.36.0", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "persistence",
    "wayland",
    "web_screen_reader",
    "wgpu",
    "x11",
] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
i_overlay = "=9.1.0"
i_triangle = "=0.50.1"
flate2 = "=1.1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
