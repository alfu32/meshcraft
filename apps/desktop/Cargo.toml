[package]
name = "meshcraft-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "meshcraft"
path = "src/main.rs"

[dependencies]
eframe.workspace = true
image.workspace = true
meshcraft-core = { path = "../../crates/meshcraft-core" }
meshcraft-io = { path = "../../crates/meshcraft-io" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["3d", "ui"] }
bevy_ecs = "=0.20.0"
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }

[dev-dependencies]
base64.workspace = true
flate2.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "=0.4.76"
wasm-bindgen = "=0.2.126"
web-sys = { version = "=0.3.103", features = ["Document", "HtmlCanvasElement", "Window"] }
