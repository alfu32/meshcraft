[package]
name = "meshcraft-desktop"
version = "0.44.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "meshcraft"
path = "src/main.rs"

[dependencies]
egui.workspace = true
image.workspace = true
meshcraft-core = { path = "../../crates/meshcraft-core" }
meshcraft-io = { path = "../../crates/meshcraft-io" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sysinfo = { version = "=0.31.4", default-features = false, features = ["system"] }
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "x11"] }
gpui-component = { version = "=0.5.1", default-features = false }
tree-sitter = "=0.25.10"
tree-sitter-javascript = "=0.25.0"
tree-sitter-glsl = "=0.2.0"
ropey = "=2.0.0-beta.1"
lsp-types = "=0.97.0"
anyhow = "=1.0.104"
raylib = "=6.0.0"
libloading = "=0.8.9"
httparse = "=1.10.1"
socket2 = "=0.6.5"
base64.workspace = true
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }

[build-dependencies]
embed-resource = "=3.0.12"
resvg = { version = "=0.45.1", default-features = false, features = ["text", "system-fonts"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "=0.13.2"

[dev-dependencies]
base64.workspace = true
flate2.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe.workspace = true
wasm-bindgen-futures = "=0.4.77"
wasm-bindgen = "=0.2.127"
web-sys = { version = "=0.3.104", features = ["Document", "HtmlCanvasElement", "Window"] }
