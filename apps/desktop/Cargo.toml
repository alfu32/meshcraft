[package]
name = "meshcraft-desktop"
version = "0.5.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "meshcraft"
path = "src/main.rs"

[dependencies]
eframe.workspace = true
image.workspace = true
meshcraft-core = { path = "../../crates/meshcraft-core" }
meshcraft-io = { path = "../../crates/meshcraft-io" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "x11"] }
gpui-component = { version = "=0.5.1", default-features = false }
raylib = "=6.0.0"
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }

[build-dependencies]
resvg = { version = "=0.45.1", default-features = false, features = ["text", "system-fonts"] }

[dev-dependencies]
base64.workspace = true
flate2.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "=0.4.77"
wasm-bindgen = "=0.2.127"
web-sys = { version = "=0.3.104", features = ["Document", "HtmlCanvasElement", "Window"] }
