name: Release

# Select an existing version tag in Run workflow (or gh workflow run --ref TAG).
# No tag input and no automatic release on push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      toolchain: ${{ steps.meta.outputs.toolchain }}
      epoch: ${{ steps.meta.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - id: meta
        name: Require selected tag to match the hardcoded desktop version
        run: python3 scripts/release/meta.py >> "$GITHUB_OUTPUT"

  validate:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ needs.prepare.outputs.toolchain }}
          components: rustfmt, clippy
      - name: Check out pinned public legacy evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: alfu32/k3d
          ref: acd84f4c67509e10363c33850501eb8f4fc3ffa7
          path: target/legacy
          fetch-depth: 1
          persist-credentials: false
      - name: Validate release helpers and planning
        run: |
          python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
          python3 docs/rewrite/scripts/verify_plan.py --source-root target/legacy
      - name: Build the old-glibc environment
        run: docker build -t meshcraft-build -f packaging/linux/Dockerfile .
      - name: Locked Rust checks in Ubuntu 18.04
        run: |
          docker run --rm -v "$PWD:/src" -v "$(rustc --print sysroot):/opt/rust:ro" \
            -v "$HOME/.cargo:/cargo" -v "$PWD/target/linux-validate:/build" meshcraft-build \
            bash -euc 'cargo fmt --all --check; cargo test --workspace --locked; cargo clippy --workspace --all-targets --locked -- -D warnings'

  build:
    needs: [prepare, validate]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, os: linux, arch: x86_64, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, os: linux, arch: aarch64, target: aarch64-unknown-linux-gnu }
          - { runner: windows-2025, os: windows, arch: x64, target: x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, os: windows, arch: arm64, target: aarch64-pc-windows-msvc }
          - { runner: macos-15-intel, os: macos, arch: x86_64, target: x86_64-apple-darwin }
          - { runner: macos-15, os: macos, arch: aarch64, target: aarch64-apple-darwin }
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      MESHCRAFT_BUILD_SHA: ${{ needs.prepare.outputs.sha }}
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.epoch }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ needs.prepare.outputs.toolchain }}
          targets: ${{ matrix.target }}
      - name: Build native Linux application and portable archives against old glibc
        if: matrix.os == 'linux'
        run: |
          docker build -t meshcraft-build -f packaging/linux/Dockerfile .
          docker run --rm -v "$PWD:/src" -v "$(rustc --print sysroot):/opt/rust:ro" \
            -v "$HOME/.cargo:/cargo" -v "$PWD/target/linux-build:/build" \
            -e RELEASE_TARGET -e RELEASE_VERSION -e SOURCE_DATE_EPOCH -e MESHCRAFT_BUILD_SHA meshcraft-build bash -euc '
              cargo build --release --locked -p meshcraft-desktop --target "$RELEASE_TARGET"
              test "$(/build/$RELEASE_TARGET/release/meshcraft --version)" = "Meshcraft $RELEASE_VERSION"
              python3 scripts/release/native_linux.py --target "$RELEASE_TARGET" \
                --binary "/build/$RELEASE_TARGET/release/meshcraft" --output /build/native --max-glibc 2.27
              python3 scripts/release/portable.py --target "$RELEASE_TARGET" \
                --binary "/build/$RELEASE_TARGET/release/meshcraft" --native /build/native --output /src/target/release-assets
            '
      - name: Configure Windows compiler and static CRT
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          "RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV
          $llvm = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (-not (Test-Path "$llvm\libclang.dll")) { throw 'Native LLVM libclang.dll is required for raylib bindgen' }
          "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
          $fxc = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter fxc.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK fxc.exe is required by GPUI release shaders' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      - name: Build Windows or macOS native application
        if: matrix.os != 'linux'
        run: cargo build --release --locked -p meshcraft-desktop --target ${{ matrix.target }}
      - name: Assemble Windows or macOS portable archives
        if: matrix.os != 'linux'
        shell: bash
        run: |
          binary="target/$RELEASE_TARGET/release/meshcraft"
          if [[ '${{ matrix.os }}' == windows ]]; then binary="$binary.exe"; fi
          test "$("$binary" --version)" = "Meshcraft $RELEASE_VERSION"
          python_cmd=python3
          if [[ '${{ matrix.os }}' == windows ]]; then python_cmd=python; fi
          "$python_cmd" scripts/release/portable.py --target "$RELEASE_TARGET" --binary "$binary" --output target/release-assets
      - name: Install Linux packagers
        if: matrix.os == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends desktop-file-utils squashfs-tools snapd libfuse2t64
      - name: Build Linux AppImage and Snap
        if: matrix.os == 'linux'
        run: |
          archive="target/release-assets/meshcraft-$RELEASE_VERSION-$RELEASE_TARGET.tar.gz"
          python3 scripts/release/appimage.py --archive "$archive" --output target/release-assets
          python3 scripts/release/snap.py --archive "$archive" --output target/release-assets
      - name: Build Windows MSI and unsigned MSIX
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch '${{ matrix.arch }}' -Version "$env:RELEASE_VERSION"
      - name: Build macOS application bundle and DMG
        if: matrix.os == 'macos'
        run: bash packaging/macos/package.sh "$RELEASE_VERSION" "$RELEASE_TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: target/release-assets/*
          if-no-files-found: error

  publish:
    needs: [prepare, validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: incoming
          merge-multiple: true
      - name: Verify the complete matrix and publish at the selected existing tag
        run: |
          python3 scripts/release/verify.py --directory incoming --version "$RELEASE_VERSION" --sha "$RELEASE_SHA"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          gh release create "$RELEASE_TAG" incoming/* target/SHA256SUMS.txt \
            --verify-tag --target "$RELEASE_SHA" --title "Meshcraft $RELEASE_VERSION" --notes-file target/release-notes.md
