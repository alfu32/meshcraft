name: Stress test

# Run after Release, selecting the SAME existing tag. No tag input, builds or tag mutations.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stress-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - id: meta
        name: Require selected existing tag, app version and source to match
        run: python3 scripts/release/meta.py >> "$GITHUB_OUTPUT"
      - name: Fail early when the same-tag published binary is absent
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_SHA: ${{ steps.meta.outputs.sha }}
        run: |
          python3 scripts/stress/download.py --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --source-revision "$RELEASE_SHA" \
            --output "$RUNNER_TEMP/preflight" --check-only

  benchmark:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        tier: [small, medium, high, heavy]
    name: Benchmark ${{ matrix.tier }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Install desktop test environment (no compiler or app build)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xdotool mesa-vulkan-drivers mesa-utils libgl1-mesa-dri dbus-x11 fonts-dejavu-core
      - id: release
        name: Require and verify the release binary from this exact tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          python3 scripts/stress/download.py --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --source-revision "$RELEASE_SHA" \
            --output "$RUNNER_TEMP/meshcraft-release" > "$RUNNER_TEMP/stress-binary.txt"
          # download.py prints the binary path after verification; gh progress may precede it.
          echo "binary=$(tail -n 1 "$RUNNER_TEMP/stress-binary.txt")" >> "$GITHUB_OUTPUT"
      - name: Collect measurements (tool outcomes are report data)
        continue-on-error: true
        shell: bash
        env:
          STRESS_BINARY: ${{ steps.release.outputs.binary }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          mkdir -p target/stress-results
          dbus-run-session -- python3 scripts/stress/run.py --binary "$STRESS_BINARY" \
            --source-revision "$RELEASE_SHA" --artifact "$RUNNER_TEMP/meshcraft-release/provenance.json" \
            --output target/stress-results --tiers "${{ matrix.tier }}" --samples 3 --timeout 90 \
            2>&1 | tee target/stress-results/runner.log
      - name: Publish the readable job summary
        if: ${{ always() }}
        run: |
          if test -f target/stress-results/performance.md; then
            cat target/stress-results/performance.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain complete results and diagnostics even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-linux-x86_64-${{ matrix.tier }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            target/stress-results/performance.*
            target/stress-results/runner.log
            target/stress-results/work/**/app.log
            target/stress-results/work/**/xvfb.log
            target/stress-results/work/**/gpu.txt

  publish:
    needs: [prepare, benchmark]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: performance-linux-x86_64-*
          path: target/stress-workers
      - name: Always publish detailed results and diagnostics to the same release
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          python3 scripts/stress/ci_publish.py --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --source-revision "$RELEASE_SHA" \
            --input target/stress-workers --output target/stress-publication
